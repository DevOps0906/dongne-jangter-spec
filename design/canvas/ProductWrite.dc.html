<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상품 정보 입력</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18202C; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; overflow: hidden;">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 4px;">
    <a href="Home.dc.html" aria-label="닫기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18202C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Gothic A1', sans-serif; font-weight: 800; font-size: 17px;">내 물건 팔기</h1>
    <span style="display: flex; align-items: center; height: 44px; padding: 0 10px; font-size: 12px; color: #5A6472;">임시저장됨</span>
  </header>

  <ol aria-label="등록 단계" style="list-style: none; margin: 0; padding: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
    <li style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5A6472;"><span style="height: 4px; border-radius: 2px; background: #18202C;"></span>1 사진 ✓ 4장</li>
    <li aria-current="step" style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #18202C; font-weight: 700;"><span style="height: 4px; border-radius: 2px; background: #C2410C;"></span>2 정보</li>
    <li style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5A6472;"><span style="height: 4px; border-radius: 2px; background: #E3E6EA;"></span>3 가격·장소</li>
  </ol>

  <form style="flex-grow: 1; min-height: 0; padding: 22px 16px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="pwrTitle" style="font-size: 13px; font-weight: 600;">제목</label>
      <input id="pwrTitle" type="text" value="이케아 포엥 암체어" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9CFD7; border-radius: 8px; font-family: inherit; font-size: 15px; color: #18202C; background: #FFFFFF;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="pwrCat" style="font-size: 13px; font-weight: 600;">카테고리</label>
      <select id="pwrCat" style="height: 48px; padding: 0 12px; border: 1px solid #C9CFD7; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #18202C;">
        <option>가구/인테리어</option>
        <option>디지털기기</option>
        <option>생활가전</option>
        <option>유아동</option>
      </select>
    </div>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px;">
      <legend style="font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 6px;">상품 상태</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
        <label style="display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid #D5DAE1; border-radius: 8px; font-size: 14px; color: #18202C;"><input type="radio" name="cond" style="position: absolute; opacity: 0; width: 1px; height: 1px;">새 상품</label>
        <label style="display: flex; align-items: center; justify-content: center; height: 44px; border: 1.5px solid #18202C; border-radius: 8px; background: #18202C; font-size: 14px; font-weight: 600; color: #FFFFFF;"><input type="radio" name="cond" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;">사용감 적음</label>
        <label style="display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid #D5DAE1; border-radius: 8px; font-size: 14px; color: #18202C;"><input type="radio" name="cond" style="position: absolute; opacity: 0; width: 1px; height: 1px;">사용감 많음</label>
      </div>
    </fieldset>
    <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-height: 0;">
      <label for="pwrDesc" style="font-size: 13px; font-weight: 600;">자세한 설명</label>
      <textarea id="pwrDesc" style="flex-grow: 1; min-height: 140px; box-sizing: border-box; padding: 12px 14px; border: 1px solid #C9CFD7; border-radius: 8px; resize: none; font-family: inherit; font-size: 15px; line-height: 1.65; color: #18202C; background: #FFFFFF;">이사 가면서 내놓아요. 2년 사용했고 쿠션 커버는 세탁했어요. 프레임 흔들림 없어요.</textarea>
      <span style="align-self: flex-end; font-size: 12px; color: #5A6472; font-variant-numeric: tabular-nums;">46 / 2,000</span>
    </div>
  </form>

  <div style="flex-shrink: 0; display: grid; grid-template-columns: 1fr 2fr; gap: 8px; padding: 16px 16px 28px;">
    <a href="PhotoUpload.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border: 1px solid #C9CFD7; border-radius: 8px; color: #18202C; font-size: 15px; font-weight: 600; text-decoration: none;">이전</a>
    <button type="button" style="height: 52px; border: 0; border-radius: 8px; background: #C2410C; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700;">다음 · 가격·장소</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
