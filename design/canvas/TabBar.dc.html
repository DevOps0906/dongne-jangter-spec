<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","community","chat","my"],"default":"home"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'home';
const c = (k) => (a === k ? '#C2410C' : '#5A6472');
const w = (k) => (a === k ? '700' : '500');
return {
cHome: c('home'), wHome: w('home'),
cCom: c('community'), wCom: w('community'),
cChat: c('chat'), wChat: w('chat'),
cMy: c('my'), wMy: w('my')
};
}
}
