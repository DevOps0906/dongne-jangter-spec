<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인·인증</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18202C; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; overflow: hidden;">
  <div style="padding: 56px 24px 0; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-family: 'Gothic A1', sans-serif; font-weight: 800; font-size: 15px; color: #C2410C; letter-spacing: -0.01em;">중고거래마켓</span>
    <h1 style="margin: 0; font-family: 'Gothic A1', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.35; letter-spacing: -0.02em;">동네 이웃과<br>거래를 시작해요</h1>
    <p style="margin: 0; font-size: 14px; color: #5A6472;">휴대폰 번호로 가입하고 로그인해요. 번호는 다른 사람에게 보이지 않아요.</p>
  </div>

  <div role="tablist" aria-label="로그인 방법" style="margin: 24px 24px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #F4F5F7; border-radius: 10px; padding: 4px; gap: 4px;">
    <button type="button" role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(24,32,44,0.12); font-family: inherit; font-size: 14px; font-weight: 700; color: #18202C;">전화번호</button>
    <button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #5A6472;">이메일</button>
    <button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #5A6472;">소셜</button>
  </div>

  <form style="padding: 24px 24px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="loginPhone" style="font-size: 13px; font-weight: 600;">휴대폰 번호</label>
      <div style="display: flex; gap: 8px;">
        <input id="loginPhone" type="tel" value="010-1234-5678" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9CFD7; border-radius: 8px; font-family: inherit; font-size: 16px; color: #18202C; background: #FFFFFF; font-variant-numeric: tabular-nums;">
        <button type="button" style="flex-shrink: 0; height: 52px; padding: 0 14px; border: 1px solid #C9CFD7; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #18202C;">다시 받기</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="loginOtp" style="font-size: 13px; font-weight: 600;">인증번호 6자리</label>
      <input id="loginOtp" type="text" inputmode="numeric" value="482 9" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 2px solid #18202C; border-radius: 8px; font-family: inherit; font-size: 20px; letter-spacing: 0.4em; color: #18202C; background: #FFFFFF; font-variant-numeric: tabular-nums;">
      <span style="display: flex; justify-content: space-between; font-size: 12px; color: #5A6472;"><span>문자로 받은 번호를 입력해 주세요</span><span style="font-variant-numeric: tabular-nums; color: #C2410C; font-weight: 600;">02:47 남음</span></span>
    </div>
    <a href="LocationSetup.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #C2410C; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none;">인증하고 시작하기</a>
  </form>

  <div style="margin-top: auto; padding: 0 24px 32px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #5A6472;"><span style="flex-grow: 1; height: 1px; background: #E3E6EA;"></span>다른 방법으로 시작하기<span style="flex-grow: 1; height: 1px; background: #E3E6EA;"></span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <button type="button" style="height: 48px; border: 1px solid #C9CFD7; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #18202C;">카카오</button>
      <button type="button" style="height: 48px; border: 1px solid #C9CFD7; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #18202C;">네이버</button>
      <button type="button" style="height: 48px; border: 1px solid #C9CFD7; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #18202C;">Apple</button>
    </div>
    <p style="margin: 0; font-size: 12px; color: #5A6472; text-align: center; line-height: 1.6;">시작하면 <a href="#terms" style="color: #18202C;">이용약관</a>과 <a href="#privacy" style="color: #18202C;">개인정보처리방침</a>에 동의하게 돼요.</p>
  </div>
</div>
</x-dc>

}

</body>
</html>
