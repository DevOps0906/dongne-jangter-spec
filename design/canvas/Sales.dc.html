<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>판매·구매 내역</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18202C; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; overflow: hidden;">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px;">
    <a href="My.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18202C;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <div role="tablist" aria-label="내역 종류" style="display: flex; gap: 4px;">
      <button type="button" role="tab" aria-selected="true" style="height: 44px; padding: 0 10px; border: 0; background: transparent; font-family: 'Gothic A1', sans-serif; font-weight: 800; font-size: 18px; color: #18202C;">판매내역</button>
      <button type="button" role="tab" aria-selected="false" style="height: 44px; padding: 0 10px; border: 0; background: transparent; font-family: 'Gothic A1', sans-serif; font-weight: 600; font-size: 18px; color: #5A6472;">구매내역</button>
    </div>
  </header>

  <div role="tablist" aria-label="판매 상태" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid #E3E6EA;">
    <button type="button" role="tab" aria-selected="true" style="height: 48px; border: 0; border-bottom: 2px solid #18202C; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #18202C; font-variant-numeric: tabular-nums;">판매중 2</button>
    <button type="button" role="tab" aria-selected="false" style="height: 48px; border: 0; border-bottom: 2px solid transparent; background: transparent; font-family: inherit; font-size: 14px; color: #5A6472; font-variant-numeric: tabular-nums;">예약중 1</button>
    <button type="button" role="tab" aria-selected="false" style="height: 48px; border: 0; border-bottom: 2px solid transparent; background: transparent; font-family: inherit; font-size: 14px; color: #5A6472; font-variant-numeric: tabular-nums;">거래완료 4</button>
  </div>

  <main style="flex-grow: 1; min-height: 0; overflow: hidden;">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="2">
      <article style="border-bottom: 8px solid #F4F5F7;">
        <a href="ProductDetail.dc.html" style="display: flex; gap: 14px; padding: 16px 16px 12px; color: #18202C; text-decoration: none;">
          <span style="width: 88px; height: 88px; flex-shrink: 0; border-radius: 8px; background: #EEF0F3; display: flex; align-items: center; justify-content: center; color: #5A6472; font-size: 11px;">[상품 사진]</span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 15px; font-weight: 500;">{{item.title}}</span>
            <span style="font-size: 12px; color: #5A6472;">{{item.meta}}</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: #DCFCE7; color: #166534;">판매중</span><span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;">{{item.price}}</span></span>
            <span style="font-size: 12px; color: #5A6472; font-variant-numeric: tabular-nums;">{{item.stats}}</span>
          </span>
        </a>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 16px 16px;">
          <button type="button" style="height: 44px; border: 1px solid #C9CFD7; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #1D4ED8;">예약중으로 바꾸기</button>
          <button type="button" style="height: 44px; border: 1px solid #C9CFD7; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #18202C;">거래완료로 바꾸기</button>
        </div>
      </article>
    </sc-for>
    <p style="margin: 16px; font-size: 12px; color: #5A6472; line-height: 1.6;">상태를 바꾸면 채팅 중인 이웃에게 알림이 가요. 거래완료로 바꾸면 거래한 이웃을 골라 후기를 남길 수 있어요.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
items: [
{ title: '다이슨 V10 무선청소기', meta: '망원동 · 1시간 전', price: '180,000원', stats: '채팅 5 · 관심 21 · 조회 133' },
{ title: '무인양품 원목 수납장', meta: '망원동 · 2일 전', price: '45,000원', stats: '채팅 1 · 관심 4 · 조회 52' }
]
};
}
}
</script>
</body>
</html>
