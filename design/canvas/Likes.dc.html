<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관심목록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18202C; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; overflow: hidden;">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px; border-bottom: 1px solid #EEF0F3;">
    <a href="My.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18202C;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Gothic A1', sans-serif; font-weight: 800; font-size: 18px;">관심목록 <span style="font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; font-size: 14px; color: #5A6472; font-variant-numeric: tabular-nums;">4</span></h1>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow: hidden;">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
      <div style="display: flex; gap: 14px; padding: 14px 8px 14px 16px; border-bottom: 1px solid #EEF0F3;">
        <a href="ProductDetail.dc.html" style="display: flex; gap: 14px; flex-grow: 1; min-width: 0; color: #18202C; text-decoration: none;">
          <span style="width: 88px; height: 88px; flex-shrink: 0; border-radius: 8px; background: #EEF0F3; display: flex; align-items: center; justify-content: center; color: #5A6472; font-size: 11px; opacity: {{item.imgOpacity}};">[상품 사진]</span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 15px; font-weight: 500; color: {{item.fg}};">{{item.title}}</span>
            <span style="font-size: 12px; color: #5A6472;">{{item.meta}}</span>
            <span style="display: flex; align-items: center; gap: 6px;">
              <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}">
                <span style="font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: {{item.badgeBg}}; color: {{item.badgeFg}};">{{item.badge}}</span>
              </sc-if>
              <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{item.fg}};">{{item.price}}</span>
            </span>
          </span>
        </a>
        <button type="button" aria-label="관심 해제" aria-pressed="true" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #C2410C;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </button>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = { hasBadge: false, badge: '', badgeBg: '', badgeFg: '', fg: '#18202C', imgOpacity: '1' };
return {
items: [
{ ...on, title: '아이폰 13 미니 128GB 미드나이트', meta: '망원동 · 3분 전', price: '420,000원' },
{ ...on, hasBadge: true, badge: '예약중', badgeBg: '#DBEAFE', badgeFg: '#1D4ED8', title: '이케아 포엥 암체어', meta: '합정동 · 12분 전', price: '35,000원' },
{ ...on, title: '시디즈 T50 사무용 의자', meta: '망원동 · 40분 전', price: '120,000원' },
{ ...on, hasBadge: true, badge: '판매완료', badgeBg: '#EEF0F3', badgeFg: '#4B5563', fg: '#5A6472', imgOpacity: '0.6', title: '캠핑 의자 2개 세트', meta: '망원동 · 3시간 전', price: '30,000원' }
]
};
}
}
</script>
</body>
</html>
