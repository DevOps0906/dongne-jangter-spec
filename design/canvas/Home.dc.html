<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈 피드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18202C; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; overflow: hidden;">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 12px;">
    <a href="LocationMap.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 4px; color: #18202C; text-decoration: none; font-family: 'Gothic A1', sans-serif; font-weight: 800; font-size: 20px;">
      망원동
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </a>
    <div style="display: flex;">
      <a href="Search.dc.html" aria-label="검색" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18202C;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </a>
      <button type="button" aria-label="알림" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #18202C; position: relative;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span style="position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 4px; background: #C2410C;"></span>
      </button>
    </div>
  </header>

  <div role="group" aria-label="카테고리" style="display: flex; gap: 8px; padding: 4px 16px 12px; overflow: hidden; flex-shrink: 0; border-bottom: 1px solid #EEF0F3;">
    <button type="button" aria-pressed="true" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #18202C; background: #18202C; color: #FFFFFF; font-family: inherit; font-size: 14px;">전체</button>
    <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #18202C; font-family: inherit; font-size: 14px;">디지털기기</button>
    <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #18202C; font-family: inherit; font-size: 14px;">가구/인테리어</button>
    <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #18202C; font-family: inherit; font-size: 14px;">생활가전</button>
    <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #18202C; font-family: inherit; font-size: 14px;">유아동</button>
  </div>

  <main style="flex-grow: 1; min-height: 0; overflow: hidden;">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
      <a href="ProductDetail.dc.html" style="display: flex; gap: 14px; padding: 14px 16px; border-bottom: 1px solid #EEF0F3; color: #18202C; text-decoration: none;">
        <span style="width: 104px; height: 104px; flex-shrink: 0; border-radius: 8px; background: #EEF0F3; display: flex; align-items: center; justify-content: center; color: #5A6472; font-size: 11px;">[상품 사진]</span>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 15px; font-weight: 500; line-height: 1.4; color: {{item.titleColor}};">{{item.title}}</span>
          <span style="font-size: 12px; color: #5A6472;">{{item.meta}}</span>
          <span style="display: flex; align-items: center; gap: 6px;">
            <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: {{item.badgeBg}}; color: {{item.badgeFg}};">{{item.badge}}</span>
            </sc-if>
            <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{item.titleColor}};">{{item.price}}</span>
          </span>
          <span style="margin-top: auto; display: flex; justify-content: flex-end; gap: 10px; font-size: 12px; color: #5A6472; font-variant-numeric: tabular-nums;">
            <span style="display: flex; align-items: center; gap: 3px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg><span>채팅 {{item.chats}}</span></span>
            <span style="display: flex; align-items: center; gap: 3px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>관심 {{item.likes}}</span></span>
          </span>
        </span>
      </a>
    </sc-for>
  </main>

  <dc-import name="TabBar" active="home" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ink = '#18202C';
const none = { hasBadge: false, badge: '', badgeBg: '', badgeFg: '', titleColor: ink };
const reserved = { hasBadge: true, badge: '예약중', badgeBg: '#DBEAFE', badgeFg: '#1D4ED8', titleColor: ink };
const sold = { hasBadge: true, badge: '판매완료', badgeBg: '#EEF0F3', badgeFg: '#4B5563', titleColor: '#5A6472' };
return {
items: [
{ ...none, title: '아이폰 13 미니 128GB 미드나이트', meta: '망원동 · 3분 전', price: '420,000원', chats: 3, likes: 12 },
{ ...reserved, title: '이케아 포엥 암체어', meta: '합정동 · 12분 전', price: '35,000원', chats: 2, likes: 6 },
{ ...none, title: '다이슨 V10 무선청소기 (배터리 교체함)', meta: '망원동 · 1시간 전', price: '180,000원', chats: 5, likes: 21 },
{ ...none, title: '아기 바운서 무료로 드려요', meta: '성산동 · 2시간 전', price: '무료나눔', chats: 8, likes: 9 },
{ ...sold, title: '캠핑 의자 2개 세트', meta: '망원동 · 3시간 전', price: '30,000원', chats: 4, likes: 7 }
]
};
}
}
</script>
</body>
</html>
