<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>채팅 목록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18202C; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; overflow: hidden;">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px;">
    <h1 style="margin: 0; font-family: 'Gothic A1', sans-serif; font-weight: 800; font-size: 20px;">채팅</h1>
  </header>

  <div role="group" aria-label="채팅 필터" style="display: flex; gap: 8px; padding: 4px 16px 12px; flex-shrink: 0; border-bottom: 1px solid #EEF0F3;">
    <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #18202C; background: #18202C; color: #FFFFFF; font-family: inherit; font-size: 14px;">전체</button>
    <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #18202C; font-family: inherit; font-size: 14px;">판매</button>
    <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #18202C; font-family: inherit; font-size: 14px;">구매</button>
    <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D5DAE1; background: #FFFFFF; color: #18202C; font-family: inherit; font-size: 14px;">안 읽음</button>
  </div>

  <main style="flex-grow: 1; min-height: 0; overflow: hidden;">
    <sc-for list="{{rooms}}" as="r" hint-placeholder-count="6">
      <a href="ChatRoom.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EEF0F3; color: #18202C; text-decoration: none;">
        <span style="width: 48px; height: 48px; border-radius: 24px; background: #D9DEE5; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="display: flex; align-items: baseline; gap: 6px;">
            <span style="font-size: 15px; font-weight: 600;">{{r.name}}</span>
            <span style="font-size: 12px; color: #5A6472;">{{r.meta}}</span>
          </span>
          <span style="font-size: 14px; color: {{r.msgColor}}; font-weight: {{r.msgWeight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.msg}}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0;">
          <span style="width: 44px; height: 44px; border-radius: 6px; background: #EEF0F3;"></span>
        </span>
        <sc-if value="{{r.hasUnread}}" hint-placeholder-val="{{false}}">
          <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #C2410C; color: #FFFFFF; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums;" aria-label="안 읽은 메시지">{{r.unread}}</span>
        </sc-if>
      </a>
    </sc-for>
  </main>

  <dc-import name="TabBar" active="chat" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const unread = (n) => ({ hasUnread: true, unread: n, msgColor: '#18202C', msgWeight: '600' });
const read = { hasUnread: false, unread: 0, msgColor: '#5A6472', msgWeight: '400' };
return {
rooms: [
{ ...unread(2), name: '합정동고양이', meta: '합정동 · 방금', msg: '7시 반에 망원역 2번 출구 괜찮을까요?' },
{ ...unread(1), name: '성산동자전거', meta: '성산동 · 12분 전', msg: '30,000원에 가격 제안을 보냈어요' },
{ ...read, name: '망원시장단골', meta: '망원동 · 1시간 전', msg: '네 감사합니다. 잘 쓸게요!' },
{ ...read, name: '연남동커피', meta: '연남동 · 어제', msg: '혹시 직거래 말고 택배도 되나요?' },
{ ...read, name: '서교동주민', meta: '서교동 · 10월 20일', msg: '거래 후기를 남겼어요' },
{ ...read, name: '망원동이웃', meta: '망원동 · 10월 18일', msg: '사진 한 장 더 볼 수 있을까요?' }
]
};
}
}
</script>
</body>
</html>
