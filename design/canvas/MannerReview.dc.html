<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>거래 후기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18202C; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; overflow: hidden;">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 4px;">
    <a href="ChatRoom.dc.html" aria-label="닫기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18202C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Gothic A1', sans-serif; font-weight: 800; font-size: 17px;">거래 후기 보내기</h1>
    <span style="width: 44px; text-align: center; font-size: 12px; color: #5A6472; font-variant-numeric: tabular-nums;">2/2</span>
  </header>

  <div style="margin: 4px 16px 0; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: #F4F5F7;">
    <span style="width: 44px; height: 44px; border-radius: 6px; background: #E3E6EA; flex-shrink: 0;"></span>
    <span style="display: flex; flex-direction: column;">
      <span style="font-size: 14px; font-weight: 600;">이케아 포엥 암체어</span>
      <span style="font-size: 12px; color: #5A6472;">합정동고양이 님과 거래했어요</span>
    </span>
  </div>

  <form style="flex-grow: 1; min-height: 0; padding: 22px 16px 0; display: flex; flex-direction: column; gap: 22px;">
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px;">
      <legend style="padding: 0; margin-bottom: 10px; font-family: 'Gothic A1', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.4;">합정동고양이 님과의 거래,<br>어떠셨나요?</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <label style="display: flex; align-items: center; justify-content: center; height: 52px; border: 1px solid #D5DAE1; border-radius: 10px; font-size: 15px; color: #18202C;"><input type="radio" name="mood" style="position: absolute; opacity: 0; width: 1px; height: 1px;">별로예요</label>
        <label style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 52px; border: 1.5px solid #18202C; border-radius: 10px; background: #18202C; font-size: 15px; font-weight: 700; color: #FFFFFF;"><input type="radio" name="mood" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>좋아요</label>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 15px; font-weight: 700;">어떤 점이 좋았나요? <span style="font-weight: 400; font-size: 13px; color: #5A6472;">여러 개 고를 수 있어요</span></legend>
      <sc-for list="{{keywords}}" as="k" hint-placeholder-count="5">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 1px solid {{k.border}}; border-radius: 10px; font-size: 15px; color: #18202C; background: {{k.bg}};">
          <input type="checkbox" checked="{{k.on}}" style="width: 20px; height: 20px; margin: 0; accent-color: #18202C;">
          {{k.text}}
        </label>
      </sc-for>
    </fieldset>
  </form>

  <div style="flex-shrink: 0; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 10px;">
    <p style="margin: 0; font-size: 12px; color: #5A6472; text-align: center;">후기는 상대방에게 이름 없이 전달되고 매너온도에 반영돼요</p>
    <a href="My.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #C2410C; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none;">후기 보내기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const k = (text, on) => ({ text, on, border: on ? '#18202C' : '#D5DAE1', bg: on ? '#F4F5F7' : '#FFFFFF' });
return {
keywords: [
k('시간 약속을 잘 지켜요', true),
k('응답이 빨라요', true),
k('친절하고 매너가 좋아요', false),
k('물건 상태가 설명과 같아요', true),
k('좋은 가격에 거래했어요', false)
]
};
}
}
</script>
</body>
</html>
